<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primeiro acesso — Conecta Caiçara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="tela-login">
  <div class="login-caixa">
    <div class="logo-topo">
      <img src="assets/logo.jpeg" alt="Logo Conecta Caiçara">
      <h1>Primeiro acesso</h1>
      <p>Criação da conta inicial de coordenação</p>
    </div>

    <div id="area-mensagem"></div>

    <form id="form-primeiro-acesso">
      <div class="campo">
        <label for="usuario">Nome de usuária</label>
        <input type="text" id="usuario" placeholder="ex: coordenacao" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" minlength="6" placeholder="mínimo 6 caracteres" required>
      </div>
      <div class="campo">
        <label for="senha-confirmar">Confirmar senha</label>
        <input type="password" id="senha-confirmar" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primario">Criar conta de coordenação</button>
    </form>

    <div class="login-dica-admin">
      Essa página só funciona <strong>uma única vez</strong>, enquanto o sistema ainda não tem nenhuma conta cadastrada. Depois de criar a primeira coordenadora, novas contas (de coordenação ou de integrantes) são criadas dentro do sistema, em "Contas de acesso".
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db.js"></script>
<script src="js/primeiro-acesso.js"></script>
</body>
</html>
