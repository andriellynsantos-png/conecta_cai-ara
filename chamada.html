<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fazer chamada — Conecta Caiçara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="chamada">

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <button class="btn-menu-mobile" id="btn-menu-mobile">☰ Menu</button>

    <div class="topo-pagina">
      <div>
        <h1>Fazer chamada</h1>
        <p class="subtitulo">Registre a presença das participantes em uma reunião.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="linha-campos">
        <div class="campo">
          <label for="c-data">Data da reunião *</label>
          <input type="date" id="c-data" required>
        </div>
        <div class="campo">
          <label for="c-atividade">Nome da reunião *</label>
          <input type="text" id="c-atividade" placeholder="ex: sala de pedra" required>
        </div>
      </div>
      <div id="aviso-chamada-existente" class="msg-erro oculto" style="margin-top:6px;"></div>
    </div>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Participante</th>
            <th>Situação</th>
            <th>Observação</th>
          </tr>
        </thead>
        <tbody id="tbody-chamada"></tbody>
      </table>
      <div id="chamada-vazia" class="tabela-vazia oculto">Nenhuma participante ativa cadastrada ainda.</div>
    </div>

    <div class="barra-acoes" style="margin-top:18px;">
      <button class="btn btn-primario" id="btn-marcar-todas-presente">Marcar todas como presentes</button>
      <button class="btn btn-secundario" id="btn-salvar-chamada">Salvar chamada</button>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/chamada.js"></script>
</body>
</html>
